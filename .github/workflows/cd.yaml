name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mindseed-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mindseed-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate frontend build variables
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is empty"
            exit 1
          fi
          echo "VITE_API_BASE_URL is configured"
          
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend-user/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mindseed-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mindseed-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets/Vars
        run: |
          cat > .env << 'EOF'
          NODE_ENV=${{ vars.NODE_ENV || 'production' }}
          PORT=${{ vars.PORT || '8000' }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

          POSTGRES_DATABASE=${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USERNAME=${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}

          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}

          AWS_REGION=${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}

          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ vars.MAIL_PORT || '587' }}
          MAIL_USER=${{ secrets.MAIL_USER }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_DRIVER=${{ vars.MAIL_DRIVER || 'smtp' }}

          TIME_ZONE=${{ vars.TIME_ZONE || 'Asia/Seoul' }}

          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          EOF
          echo "Created .env file"

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "docker-compose.yaml,.env"
          target: "/home/${{ secrets.EC2_USER }}/mindseed"
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/mindseed
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -af || true
            docker container prune -f || true
            docker network prune -f || true
            docker compose ps
